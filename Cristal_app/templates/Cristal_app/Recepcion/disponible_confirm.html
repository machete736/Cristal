{% extends "Cristal_app/base_adminlte.html" %}
{% block title %}Marcar Disponible{% endblock %}
{% block content %}
<section class="content-header">
  <h1>Marcar Disponible | Habitación {{ habitacion.numero }}</h1>
</section>
<section class="content">
  <div class="box box-success">
    <div class="box-header with-border">
      <h3 class="box-title">Confirmar</h3>
    </div>
    <div class="box-body">
      <p>¿Poner la habitación <strong>{{ habitacion.numero }}</strong> en estado <strong>DISPONIBLE</strong>?</p>
    </div>
    <div class="box-footer">
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'recepcion' %}" class="btn btn-default">Cancelar</a>
        <button class="btn btn-success pull-right" type="submit">
          <i class="fa fa-check"></i> Sí, marcar disponible
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
