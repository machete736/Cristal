{% extends "Cristal_app/base_adminlte.html" %}
{% load static %}
{% block page_title %}Tipos de Habitación{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <p>¿Eliminar <strong>{{ object.nombre }}</strong>?</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger"><i class="fas fa-trash"></i> Eliminar</button>
      <a class="btn btn-light" href="{% url 'tipohabitacion_list' %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
