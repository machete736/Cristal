{% extends "Cristal_app/base_adminlte.html" %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<h1>¿Estás seguro de que quieres eliminar la habitación {{ habitacion.numero }}?</h1>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'habitacion_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
